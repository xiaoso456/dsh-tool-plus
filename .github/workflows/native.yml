name: Native addons

on:
  pull_request:
    paths:
      - "vendor/oh-my-pi/**"
      - "scripts/vendor.mjs"
      - ".github/workflows/native.yml"
  push:
    tags:
      - "native-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep this aligned with vendor/oh-my-pi/lock.json. The workflow reads the
  # lock file for the actual checkout ref, but the tool versions are explicit
  # so a runner-image change cannot silently select another Bazel/Bun.
  BUN_VERSION: "1.4.2"
  BAZELISK_VERSION: "1.28.1"

jobs:
  vendor:
    name: Vendor pin and patches
    runs-on: ubuntu-22.04
    outputs:
      omp_commit: ${{ steps.lock.outputs.omp_commit }}
      omp_tag: ${{ steps.lock.outputs.omp_tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Read vendor lock
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          echo "omp_commit=$(jq -r .commit vendor/oh-my-pi/lock.json)" >> "$GITHUB_OUTPUT"
          echo "omp_tag=$(jq -r .tag vendor/oh-my-pi/lock.json)" >> "$GITHUB_OUTPUT"
      - name: Checkout pinned oh-my-pi
        uses: actions/checkout@v4
        with:
          repository: can1357/oh-my-pi
          ref: ${{ steps.lock.outputs.omp_commit }}
          path: vendor/oh-my-pi/upstream
          fetch-depth: 1
      - name: Verify pin and patch series
        shell: bash
        run: node scripts/vendor.mjs check

  build:
    name: ${{ matrix.artifact }}
    if: github.event_name != 'pull_request'
    needs: vendor
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # `family` groups targets that download the same third-party payloads, so
        # one representative per family can save the shared input cache; `family`
        # also keeps those entries apart (a Linux runner builds both gnu and
        # win32 targets, and they fetch different toolchains).
        # Only the targets a platform package is published for are built: the
        # modern (AVX2) variant and both musl targets exist as bazel targets but
        # nothing ships or consumes them (upstream publishes exactly this set).
        include:
          - { artifact: linux-x64-baseline, target: linux-x64-baseline, runner: ubuntu-22.04, family: linux, saveInputs: true }
          - { artifact: linux-arm64, target: linux-arm64, runner: ubuntu-24.04-arm, family: linux }
          # Darwin stays on Mac runners. Building it on Linux (like upstream's
          # cross job) needs @macos_sdk, whose pinned CLTools package URL is dead
          # -- 403 from a residential IP too, so it is not a runner-network
          # problem, it is upstream's pin having bit-rotted. Fixing it means
          # vendoring our own URL + sha256 into bazel/toolchains/darwin/sdk.bzl
          # (a patch that must be re-kept alive on every bump) for no wall-clock
          # gain: darwin is not the critical path, the linux/win32 jobs are.
          - { artifact: darwin-arm64, target: darwin-arm64, runner: macos-15, family: darwin, saveInputs: true, saveActions: true }
          - { artifact: darwin-x64-baseline, target: darwin-x64-baseline, runner: macos-15-intel, family: darwin, saveActions: true }
          # Windows: OMP's msvc cross toolchain runs on Linux/mac exec hosts.
          - { artifact: win32-x64-baseline, target: win32-x64-baseline, runner: ubuntu-22.04, family: win32, saveInputs: true }
          - { artifact: win32-arm64, target: win32-arm64, runner: ubuntu-22.04, family: win32 }
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned oh-my-pi
        uses: actions/checkout@v4
        with:
          repository: can1357/oh-my-pi
          ref: ${{ needs.vendor.outputs.omp_commit }}
          path: vendor/oh-my-pi/upstream
          fetch-depth: 1
      - name: Sync local overlay
        shell: bash
        run: node scripts/vendor.mjs sync
      - name: Apply local patches
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          patches=(vendor/oh-my-pi/patches/*.patch)
          for patch in "${patches[@]}"; do
            echo "applying $patch"
            git -C vendor/oh-my-pi/upstream apply "$PWD/$patch"
          done
      # A cold Bazel run re-downloads everything it needs before compiling a
      # single crate: the LLVM toolchain, the xwin MSVC sysroot (~1 GiB on the
      # win32 targets), every external repository, and — because .bazelrc sets
      # CARGO_BAZEL_ISOLATED=0 — the crates.io index through the host ~/.cargo.
      # All three are pure inputs keyed by content, so caching them can only
      # change how long the run takes, never what it produces.
      - name: Restore bazel/cargo inputs
        id: inputs-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/bazel-repo
            ~/.cargo/registry
            ~/.cargo/git
          key: native-inputs-${{ runner.os }}-${{ matrix.family }}-${{ hashFiles('vendor/oh-my-pi/upstream/MODULE.bazel', 'vendor/oh-my-pi/upstream/Cargo.lock') }}
          restore-keys: |
            native-inputs-${{ runner.os }}-${{ matrix.family }}-
      - name: Restore xwin MSVC sysroot
        id: xwin-cache
        if: matrix.family == 'win32'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/xwin
          key: xwin-sysroot-${{ matrix.artifact }}-${{ hashFiles('vendor/oh-my-pi/upstream/MODULE.bazel') }}
          restore-keys: xwin-sysroot-${{ matrix.artifact }}-
      # Round 2: persist bazel's action cache too, so an unchanged tree skips
      # the compile instead of only its downloads. Action keys are per target
      # configuration, so a cache is worth its bytes only for the jobs that set
      # the run's wall clock (the darwin pair); `saveActions` marks those. The
      # other jobs leave the flag off: they neither restore nor enable
      # --disk_cache, so nothing but those two entries enters the cache budget.
      - name: Restore bazel action cache
        id: action-cache
        if: matrix.saveActions
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/bazel-disk
          key: bazel-actions-${{ matrix.artifact }}-${{ hashFiles('vendor/oh-my-pi/upstream/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            bazel-actions-${{ matrix.artifact }}-${{ hashFiles('vendor/oh-my-pi/upstream/Cargo.lock') }}-
            bazel-actions-${{ matrix.artifact }}-
      # bazel-natives.ts reads OMP_BAZEL_RC and hands the fragment to every
      # bazel invocation, so the cache wiring stays out of the build script.
      - name: Compose bazel cache config
        shell: bash
        run: |
          set -euo pipefail
          rc="$RUNNER_TEMP/bazel-cache.rc"
          {
            echo "build --repository_cache=$HOME/.cache/bazel-repo"
            echo "build --repo_env=OMP_XWIN_CACHE_DIR=$HOME/.cache/xwin"
            # Only participants get a disk cache: a non-participant would
            # write gigabytes here and then throw them away.
            [ "${{ matrix.saveActions }}" = "true" ] && echo "build --disk_cache=$HOME/.cache/bazel-disk"
            true
          } > "$rc"
          cat "$rc"
          echo "OMP_BAZEL_RC=$rc" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install Bazelisk
        shell: bash
        # GitHub 托管的 Linux/macOS runner 上 /usr/local 归 root，`npm install -g`
        # 会以 EACCES 失败在 rename 那一步（不是找不到包）。装到用户可写的
        # prefix，再把它的 bin 目录挂进后续步骤的 PATH。
        run: |
          set -euo pipefail
          npm install --global --prefix "$HOME/.npm-global" "@bazel/bazelisk@${BAZELISK_VERSION}"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
      - name: Install pinned Rust toolchain
        shell: bash
        working-directory: vendor/oh-my-pi/upstream
        run: rustup show
      - name: Build native addon
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/build/$ARTIFACT"
          cd vendor/oh-my-pi/upstream
          bun run scripts/bazel-natives.ts "$TARGET" --dest "$GITHUB_WORKSPACE/build/$ARTIFACT"
      - name: Verify addon artifact
        shell: bash
        run: |
          set -euo pipefail
          find "build/${{ matrix.artifact }}" -type f -name "*.node" -print
          test "$(find "build/${{ matrix.artifact }}" -type f -name "*.node" | wc -l)" -ge 1
      - uses: actions/upload-artifact@v4
        with:
          name: pi-natives-${{ matrix.artifact }}
          path: build/${{ matrix.artifact }}/*.node
          if-no-files-found: error
          # A test run is disposable: nine 44 MB addons kept for the default 90
          # days is a lot of dead weight on the repo's artifact storage.
          retention-days: 7
      # One writer per family. Concurrent saves to one key lose the race and
      # only warn, so a designated representative owns each entry.
      - name: Save bazel/cargo inputs
        if: always() && matrix.saveInputs && steps.inputs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/bazel-repo
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.inputs-cache.outputs.cache-primary-key }}
      - name: Save xwin MSVC sysroot
        if: always() && matrix.family == 'win32' && steps.xwin-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/xwin
          key: ${{ steps.xwin-cache.outputs.cache-primary-key }}
      - name: Save bazel action cache
        # `always()` keeps the save alive when the build fails after populating
        # the cache (partial hits still help the next run); the hit check keeps
        # a repeated run from re-uploading bytes it just restored.
        if: always() && matrix.saveActions && steps.action-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/bazel-disk
          key: ${{ steps.action-cache.outputs.cache-primary-key }}

  # Native Windows smoke build. It is not a release artifact: it proves the
  # local Cargo/N-API path still works with the current VS Build Tools image.
  windows-host-smoke:
    name: Windows host smoke
    if: github.event_name != 'pull_request'
    needs: vendor
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned oh-my-pi
        uses: actions/checkout@v4
        with:
          repository: can1357/oh-my-pi
          ref: ${{ needs.vendor.outputs.omp_commit }}
          path: vendor/oh-my-pi/upstream
          fetch-depth: 1
      - name: Sync local overlay
        shell: bash
        run: node scripts/vendor.mjs sync
      - name: Apply local patches
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          patches=(vendor/oh-my-pi/patches/*.patch)
          for patch in "${patches[@]}"; do
            echo "applying $patch"
            git -C vendor/oh-my-pi/upstream apply "$PWD/$patch"
          done
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install native build dependencies
        shell: bash
        working-directory: vendor/oh-my-pi/upstream
        run: bun install --frozen-lockfile --ignore-scripts --filter @oh-my-pi/pi-natives
      - name: Install pinned Rust toolchain
        shell: bash
        working-directory: vendor/oh-my-pi/upstream
        run: rustup show
      - name: Build host addon
        shell: bash
        run: |
          set -euo pipefail
          cd vendor/oh-my-pi/upstream
          bun run scripts/bazel-natives.ts host --dest "$GITHUB_WORKSPACE/build/win32-host"

  publish:
    name: Publish GitHub Release
    # 只发干净版本号的 tag（native-v18.12.6）。带后缀的测试 tag
    # （native-v0.0.0-dev.1 / -test.1 / -rc.1）只跑构建、不建 Release，
    # 否则每验证一次链路都会在 Releases 页面留一个垃圾条目。
    if: startsWith(github.ref, 'refs/tags/native-v') && !contains(github.ref_name, '-')
    needs: [vendor, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pi-natives-*
          path: dist
      - name: Write checksums
        shell: bash
        run: |
          set -euo pipefail
          find dist -type f -name "*.node" -print0 | sort -z | xargs -0 sha256sum > dist/SHA256SUMS
          cat dist/SHA256SUMS
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(find dist -type f -name "*.node" -print)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" dist/SHA256SUMS --clobber
          else
            gh release create "$TAG" "${assets[@]}" dist/SHA256SUMS \
              --title "Native addons $TAG" \
              --notes "Pinned oh-my-pi ${{ needs.vendor.outputs.omp_tag }} (${{ needs.vendor.outputs.omp_commit }})."
          fi
